[project]
name = "torchdiffeq-initzero"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[dependency-groups]
dev = [
    "detest>=0.2",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "torchdiffeq"
module-root = ""